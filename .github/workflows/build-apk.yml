name: Kaptan Browser - Android APK Build

on:
  push:
      branches: [ main, master, kiwi ]
        pull_request:
            branches: [ main, master, kiwi ]
              workflow_dispatch:
                  inputs:
                        build_type:
                                description: 'Build Type (debug or release)'
                                        required: true
                                                default: 'debug'
                                                        type: choice
                                                                options:
                                                                        - debug
                                                                                - release

                                                                                jobs:
                                                                                  build-apk:
                                                                                      name: Build Kaptan Browser APK
                                                                                          runs-on: ubuntu-latest
                                                                                              timeout-minutes: 90

                                                                                                  steps:
                                                                                                      - name: Checkout repository
                                                                                                            uses: actions/checkout@v4
                                                                                                                  with:
                                                                                                                          submodules: recursive
                                                                                                                                  fetch-depth: 0
                                                                                                                                  
                                                                                                                                      - name: Setup JDK 17
                                                                                                                                            uses: actions/setup-java@v4
                                                                                                                                                  with:
                                                                                                                                                          distribution: 'temurin'
                                                                                                                                                                  java-version: '17'
                                                                                                                                                                  
                                                                                                                                                                      - name: Setup Android SDK
                                                                                                                                                                            uses: android-actions/setup-android@v3
                                                                                                                                                                            
                                                                                                                                                                                - name: Install system dependencies
                                                                                                                                                                                      run: |
                                                                                                                                                                                              sudo apt-get update
                                                                                                                                                                                                      sudo apt-get install -y openjdk-17-jdk git gperf python3 dbus-x11
                                                                                                                                                                                                      
                                                                                                                                                                                                          - name: Install NDK
                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                        sdkmanager --install "ndk;25.2.9519653"
                                                                                                                                                                                                                        
                                                                                                                                                                                                                            - name: Sync repository submodules
                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                          echo "Syncing repository..."
                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                              - name: Run build script
                                                                                                                                                                                                                                                    run: |
                                                                                                                                                                                                                                                            chmod +x build.sh || true
                                                                                                                                                                                                                                                                    chmod +x build-apk.sh || true
                                                                                                                                                                                                                                                                            if [ -f "build-apk.sh" ]; then
                                                                                                                                                                                                                                                                                      ./build-apk.sh
                                                                                                                                                                                                                                                                                              elif [ -f "build.sh" ]; then
                                                                                                                                                                                                                                                                                                        ./build.sh
                                                                                                                                                                                                                                                                                                                else
                                                                                                                                                                                                                                                                                                                          echo "Starting build..."
                                                                                                                                                                                                                                                                                                                                  fi
                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                      - name: Upload APK artifact
                                                                                                                                                                                                                                                                                                                                            uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                  with:
                                                                                                                                                                                                                                                                                                                                                          name: KaptanBrowser-APK
                                                                                                                                                                                                                                                                                                                                                                  path: |
                                                                                                                                                                                                                                                                                                                                                                            **/*.apk
                                                                                                                                                                                                                                                                                                                                                                                      out/Default/apks/*.apk
