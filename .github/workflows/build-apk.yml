name: Kaptan Browser - Android APK Build

on:
  push:
      branches: [ main, master, kiwi ]
        pull_request:
            branches: [ main, master, kiwi ]
              workflow_dispatch:
                  inputs:
                        build_type:
                                description: 'Build Type (debug or release)'
                                        required: true
                                                default: 'debug'
                                                        type: choice
                                                                options:
                                                                          - debug
                                                                                    - release

                                                                                    jobs:
                                                                                      build-apk:
                                                                                          name: Build Kaptan Browser APK
                                                                                              runs-on: ubuntu-latest
                                                                                                  timeout-minutes: 90

                                                                                                      steps:
                                                                                                            - name: Kodu Indir (Checkout)
                                                                                                                    uses: actions/checkout@v4
                                                                                                                            with:
                                                                                                                                      submodules: recursive
                                                                                                                                                fetch-depth: 0
                                                                                                                                                
                                                                                                                                                      - name: JDK 17 Kur
                                                                                                                                                              uses: actions/setup-java@v4
                                                                                                                                                                      with:
                                                                                                                                                                                distribution: 'temurin'
                                                                                                                                                                                          java-version: '17'
                                                                                                                                                                                                    cache: 'gradle'
                                                                                                                                                                                                    
                                                                                                                                                                                                          - name: Android SDK Ayarla
                                                                                                                                                                                                                  uses: android-actions/setup-android@v3
                                                                                                                                                                                                                  
                                                                                                                                                                                                                        - name: Gradle Cache
                                                                                                                                                                                                                                uses: actions/cache@v4
                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                  path: |
                                                                                                                                                                                                                                                              ~/.gradle/caches
                                                                                                                                                                                                                                                                          ~/.gradle/wrapper
                                                                                                                                                                                                                                                                                    key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                                                                                                                                                                                                                                                                                              restore-keys: |
                                                                                                                                                                                                                                                                                                          ${{ runner.os }}-gradle-
                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                - name: Gradle Izin Ver
                                                                                                                                                                                                                                                                                                                        run: chmod +x gradlew
                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                              - name: Debug APK Derle
                                                                                                                                                                                                                                                                                                                                      if: ${{ github.event.inputs.build_type != 'release' }}
                                                                                                                                                                                                                                                                                                                                              run: ./gradlew assembleDebug --no-daemon --stacktrace
                                                                                                                                                                                                                                                                                                                                                      env:
                                                                                                                                                                                                                                                                                                                                                                JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                      - name: Release APK Derle
                                                                                                                                                                                                                                                                                                                                                                              if: ${{ github.event.inputs.build_type == 'release' }}
                                                                                                                                                                                                                                                                                                                                                                                      run: ./gradlew assembleRelease --no-daemon --stacktrace
                                                                                                                                                                                                                                                                                                                                                                                              env:
                                                                                                                                                                                                                                                                                                                                                                                                        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                              - name: APK Dosyasini Bul
                                                                                                                                                                                                                                                                                                                                                                                                                      id: find-apk
                                                                                                                                                                                                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                        APK_PATH=$(find . -name "*.apk" -not -path "*/test*" | head -1)
                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "Bulunan APK: $APK_PATH"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ls -lh $APK_PATH 2>/dev/null || echo "APK bulunamadi"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - name: APK Artifact Yukle
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      name: KaptanBrowser-APK-${{ github.run_number }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                path: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            **/build/outputs/apk/**/*.apk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      retention-days: 30
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if-no-files-found: warn
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Build Ozeti
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if: always()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "## Kaptan Browser APK Build Ozeti" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo "| Bilgi | Deger |" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "| Build No | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "APK basariyla derlendi! Artifacts sekmesinden indirebilirsiniz." >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  release:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      name: GitHub Release Olustur
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          needs: build-apk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if: startsWith(github.ref, 'refs/tags/v')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - name: Artifact Indir
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    uses: actions/download-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      name: KaptanBrowser-APK-${{ github.run_number }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                path: apk-output
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: GitHub Release Yayinla
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              uses: softprops/action-gh-release@v2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                name: "Kaptan Browser ${{ github.ref_name }}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          body: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ## Kaptan Browser ${{ github.ref_name }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ### Kurulum
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              1. APK dosyasini telefonunuza indirin
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          2. Ayarlar -> Guvenlik -> Bilinmeyen Kaynaklar'i etkinlestirin
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      3. APK'ya tiklayarak kurun
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ### Ozellikler
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - Dahili AdBlocker
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - YouTube tam destek
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - Guvenli tarama
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - Kaptan Servis kisayolu
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ### Destek
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          WhatsApp: +90 530 849 6559
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    files: apk-output/**/*.apk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              draft: false
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        prerelease: false
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
